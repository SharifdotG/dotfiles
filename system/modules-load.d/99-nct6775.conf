# Load the Nuvoton sensor driver at boot.
#
# MSI B450 boards (such as B450M Mortar MAX) use a Nuvoton NCT6797D Super-I/O
# chip supported by the in-tree `nct6775` kernel driver.
#
# It is not auto-loaded via PNP/ACPI on all BIOS revisions, hence this drop-in.
#
# NB: verify by reading SENSORS, not by checking the module is loaded. `lsmod`
# saying nct6775 is present only proves it was inserted, not that it bound to
# hardware. The honest check is:
#     sensors | grep -i fan
# and that is what scripts/doctor.sh does.
nct6775
