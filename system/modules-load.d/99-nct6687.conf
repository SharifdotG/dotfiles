# Load the Nuvoton sensor driver at boot.
#
# MSI B450/B550 boards (B450M Mortar MAX included) use a Nuvoton Super-I/O chip
# that the in-tree nct6683 driver binds but barely reads: no fan RPM, no useful
# voltages, no PWM control. nct6687 - the out-of-tree DKMS driver from
# packages/cpu-amd.tsv - is the one that exposes fan1_input and pwm*.
#
# It is not auto-loaded because it is not in-tree and there is no modalias
# match, hence this file.
#
# NB: verify by reading SENSORS, not by checking the module is loaded. `lsmod`
# saying nct6687 is present only proves it was inserted, not that it bound to
# anything - on a board without the chip it loads and reports nothing at all.
# The honest check is:
#     sensors | grep -i fan
# and that is what scripts/doctor.sh does.
#
# NB: DKMS. It rebuilds on every kernel update, and when that build fails the
# module is simply absent on the next boot with no error anywhere you would
# look. If fans vanish from `sensors` after an update, run `dkms status` first.
nct6687
