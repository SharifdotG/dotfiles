# Unlock the amdgpu power-management interface (fan curve, power limit, clocks).
#
# Without this, /sys/class/drm/card*/device/pp_od_clk_voltage and the manual
# fan controls do not exist, and LACT (or CoreCtrl) can only show you numbers -
# it cannot change any of them. The driver ships the interface disabled.
#
# NB: a modprobe.d option, NOT a kernel command-line parameter, and the choice
# matters. Every guide reaches for amdgpu.ppfeaturemask=0xffffffff in the
# bootloader, which means editing /etc/default/grub or a systemd-boot entry -
# machine-local files this repo deliberately does not manage, and which differ
# between the two bootloaders. A modprobe.d option reaches the module the same
# way and is bootloader-agnostic.
#
# NB: it only works because amdgpu loads from the INITRAMFS (the kms hook
# pulls it in), and mkinitcpio's `modconf` hook copies /etc/modprobe.d/*.conf
# into the image - verified at /usr/lib/initcpio/install/modconf, which does
#     add_full_dir /etc/modprobe.d '*.conf'
# So this file is inert until `mkinitcpio -P` has run. system/apply.sh runs it
# for you, but only when this file actually changed.
#
# NB: if `modconf` is missing from HOOKS in /etc/mkinitcpio.conf, the file never
# reaches the image and this silently does nothing - which is why doctor.sh
# reads the value back from /sys/module/amdgpu/parameters/ppfeaturemask rather
# than checking that this file exists. If it reads 0 after a reboot, either add
# modconf to HOOKS or fall back to the kernel command line.
#
# 0xffffffff = every feature bit. The narrower value people quote, 0xfffd7fff,
# only clears the two OverDrive-disable bits; there is no benefit to being
# surgical here on a card you own.
options amdgpu ppfeaturemask=0xffffffff
