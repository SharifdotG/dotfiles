# zram is RAM-speed, so swap EARLY and OFTEN. This is correct for zram-only
# systems and is the opposite of the usual "set swappiness low" advice, which
# assumes swap is on a slow disk. Measured on this machine: zstd holds 8.04 GiB
# of pages in 2.12 GiB of RAM, a 3.79:1 ratio.
#
# NB: CachyOS's cachyos-settings package ships its own sysctl drop-in under
# /usr/lib/sysctl.d/ which sets vm.swappiness=100. This file is a deliberate
# OVERRIDE of a vendor default, not a gap being filled.
#
# NB: sysctl.d files from /etc, /run and /usr/lib are merged and applied in
# FILENAME order across all three directories; only an *identical basename* in
# /etc masks a /usr/lib file. "99-memory-tuning" sorts after
# "99-cachyos-settings", so ours wins - by luck of the alphabet, not by design.
# system/apply.sh re-reads vm.swappiness after `sysctl --system` for exactly
# this reason. Never trust this file; trust `sysctl -n vm.swappiness`.
#
# NB: AND THIS FILE IS NOT ENOUGH ON ITS OWN. Discovered 2026-09-04 by doctor.sh
# reporting 150 while every sysctl.d file and `systemd-analyze cat-config
# sysctl.d` said 180. The clobber is not from sysctl at all - it is udev:
#     /usr/lib/udev/rules.d/30-zram.rules   (cachyos-settings)
#     ACTION=="change", KERNEL=="zram0", ... SYSCTL{vm.swappiness}="150"
# `sysctl --system` runs once, early; that rule runs afterwards on every zram0
# `change` event, so it always has the last word. The counter-rule is
# system/udev/rules.d/99-zram-swappiness.rules, which apply.sh installs
# alongside this file. Changing the number below means changing it there too.
vm.swappiness = 180

# zram has no seek penalty — never read ahead on swap-in.
vm.page-cluster = 0

# Don't over-reclaim into huge free blocks we don't need.
vm.watermark_boost_factor = 0

# Start reclaiming a bit earlier so we never hit the wall at full speed.
vm.watermark_scale_factor = 125

# Enable magic SysRq — your emergency brake (see Layer 4).
kernel.sysrq = 1

# Nx / Angular / VS Code watch enormous trees. Without this you get ENOSPC.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
