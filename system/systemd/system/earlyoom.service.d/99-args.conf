# earlyoom's arguments. This is the hard backstop below systemd-oomd - see
# docs/SETUP-GUIDE.md Phase 4, Layer 2b.
#
# NB: this deliberately does NOT use Environment="EARLYOOM_ARGS=...", and it
# deliberately does not write /etc/default/earlyoom either. Arch's earlyoom
# package ships a populated /etc/default/earlyoom AND a unit that reads it with
# EnvironmentFile=, and systemd.exec(5) is explicit that EnvironmentFile=
# OVERRIDES Environment=. So a drop-in using Environment= loses to the vendor
# file, silently: `systemctl cat` shows your config, `is-active` says active,
# and earlyoom runs upstream defaults. Overriding argv directly is the only
# form immune to that. It also keeps us out of a pacman `backup=` file, so an
# earlyoom upgrade can never park a .pacnew next to our settings.
#
# NB: the empty ExecStart= is required - it RESETS the list. Without it systemd
# refuses the unit with "more than one ExecStart= setting".
#
# NB: earlyoom matches against /proc/<pid>/comm, which the kernel truncates to
# 15 characters. "xwayland-satellite" is 18 and would never match; it has to be
# written "xwayland-satell". That is the same trap "Isolated Web Co" (Firefox's
# truncated content-process name) already works around below.
#
# The --avoid list is load-bearing and must name the CURRENT session. Under
# Plasma it named kwin_wayland/plasmashell/kded6/krunner/sddm. Every one of
# those is gone; an avoid-list naming only dead processes protects nothing, and
# earlyoom's first kill under pressure would be as likely to be the compositor
# as the runaway Node process - turning the OOM protection into an OOM cause.
[Service]
ExecStart=
ExecStart=/usr/bin/earlyoom -r 3600 -m 4 -s 20 \
  --avoid '^(systemd|systemd-.*|sshd|niri|noctalia|xwayland-satell|Xwayland|greetd|agreety|tuigreet|dbus-.*|pipewire|wireplumber|gnome-keyring-d|NetworkManager)$' \
  --prefer '^(node|Web Content|Isolated Web Co|firefox|code-insiders|dotnet|sqlservr|java)$' \
  -n
