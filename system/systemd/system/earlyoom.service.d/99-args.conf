# earlyoom's arguments. This is the hard backstop below systemd-oomd - see
# docs/SETUP-GUIDE.md Phase 4, Layer 2b.
#
# NB: this deliberately does NOT use Environment="EARLYOOM_ARGS=...", and it
# deliberately does not write /etc/default/earlyoom either. Arch's earlyoom
# package ships a populated /etc/default/earlyoom AND a unit that reads it with
# EnvironmentFile=, and systemd.exec(5) is explicit that EnvironmentFile=
# OVERRIDES Environment=. So a drop-in using Environment= loses to the vendor
# file, silently: `systemctl cat` shows your config, `is-active` says active,
# and earlyoom runs upstream defaults. Overriding argv directly is the only
# form immune to that. It also keeps us out of a pacman `backup=` file, so an
# earlyoom upgrade can never park a .pacnew next to our settings.
#
# NB: the empty ExecStart= is required - it RESETS the list. Without it systemd
# refuses the unit with "more than one ExecStart= setting".
#
# NB: earlyoom matches against /proc/<pid>/comm, which the kernel truncates to
# 15 characters. Anything longer will never match, however correct it looks -
# "Isolated Web Co" below is Firefox's truncated content-process name, not a
# typo. Check with `ps -eo comm` before adding a long name here.
#
# The --avoid list must name the CURRENT session's processes. Killing
# kwin_wayland or plasmashell to reclaim memory loses the whole desktop, which
# is strictly worse than whatever it was trying to save.
#
# NB: `sqlservr` in --prefer is NOT a leftover, and it is not a package name.
# SQL Server runs in a CONTAINER here (nopCommerce; see SETUP-GUIDE Phase 5),
# and container processes are ordinary host processes with an ordinary comm, so
# earlyoom sees `sqlservr` exactly like anything else. It is on the list because
# it is the single biggest thing on the machine that can be restarted cheaply -
# see also the MSSQL_MEMORY_LIMIT_MB trap in the guide. Do not "tidy" it away
# for not appearing in packages/*.tsv; nothing in that container ever will.
#
# NB: --prefer got worse when the browser changed, and it is worth knowing why.
# Firefox named its content processes "Isolated Web Co" and its parent
# "firefox", so earlyoom could be pointed at TABS specifically and would never
# take the whole browser. Chromium names every process in the tree `brave` -
# parent, renderers, GPU, utility, all of it. So earlyoom kills whichever is
# biggest, and that is usually a renderer but CAN be the parent, which takes the
# entire browser with it. There is no way to express "tabs only" here.
# Verified with: `for p in $(pgrep -f brave-origin); do cat /proc/$p/comm; done | sort -u`
[Service]
ExecStart=
ExecStart=/usr/bin/earlyoom -r 3600 -m 4 -s 20 \
  --avoid '^(systemd|systemd-.*|sshd|kwin_wayland|plasmashell|kded6|krunner|ksmserver|plasma-.*|sddm|sddm-greeter|dbus-.*|pipewire|wireplumber|NetworkManager)$' \
  --prefer '^(node|brave|code-insiders|dotnet|sqlservr|java)$' \
  -n
