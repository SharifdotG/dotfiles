# Let systemd-oomd kill inside the user session when memory pressure on a slice
# stays above the limit for DefaultMemoryPressureDurationSec (10s, set in
# oomd.conf.d/99-aggressive.conf).
#
# NB: the reasoning here INVERTS from what it was on Fedora. Fedora shipped
# /usr/lib/systemd/user/slice.d/10-oomd-per-slice-defaults.conf (from the
# systemd-oomd-defaults subpackage) with a 50% limit, so this file was an
# override. Arch ships no such default, so on CachyOS this drop-in is the ONLY
# thing setting the limit. It is more load-bearing here, not less.
#
# NB: systemd-oomd is not enabled by default on Arch either - Fedora enabled it
# via a preset. system/apply.sh enables it explicitly; without that, everything
# in this file is inert.
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=45%
