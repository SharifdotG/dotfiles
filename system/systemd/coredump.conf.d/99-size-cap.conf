# Same defect as the journal: unbounded until it hits the 10%-of-/var default.
# Measured 389 MB in /var/lib/systemd/coredump on the Fedora machine, with no
# /etc/systemd/coredump.conf.d at all. Nothing ever reads these.
#
# NB: ProcessSizeMax is what makes this safe on a 16 GB box. Firefox's address
# space is several GB; without a limit, one browser crash writes a multi-GB
# core to disk *under the very memory pressure that caused the crash*. Over the
# limit the dump is SKIPPED rather than truncated, which is the behaviour we
# want - a truncated core is useless anyway.
[Coredump]
Storage=external
Compress=yes
ProcessSizeMax=2G
ExternalSizeMax=2G
MaxUse=1G
KeepFree=5G
