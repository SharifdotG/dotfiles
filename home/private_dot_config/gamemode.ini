# GameMode - applied for the duration of a game, reverted when it exits.
# Desktop machine only (see home/.chezmoiignore).
#
# Verify it is actually running, live, rather than trusting this file:
#   gamemoded -s          -> "gamemode is active" while a game runs
#   cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor
# The second is the point: gamemode claims to set the governor, so read the
# governor back from the kernel, not from here.

[general]
# NB: `performance` is the whole reason this file exists. Zen 2 with
# amd_pstate parks at low clocks under a bursty game load and the frame-time
# graph shows it as stutter that looks like a GPU problem.
desiredgov=performance
defaultgov=schedutil
softrealtime=auto
renice=10
ioprio=1

[filter]
# Blank = apply to everything that asks. Steam games request gamemode through
# the `gamemoderun %command%` launch option; nothing is applied to processes
# that do not ask.

[gpu]
# NB: DELIBERATELY OFF, and this is the important line in the file.
#
# gamemode can raise the AMD performance level itself
# (apply_gpu_optimisations=accept-responsibility + amd_performance_level=high),
# and LACT - which packages/gpu-amd.tsv installs - drives the same sysfs knobs
# for the fan curve and power limit. Two daemons writing one set of files is
# the TLP-versus-power-profiles-daemon mistake from docs/SETUP-GUIDE.md with
# different names on it: whichever wrote last wins, the fan curve silently
# reverts, and nothing errors.
#
# So the GPU belongs to LACT and the CPU belongs to gamemode. If you would
# rather it were the other way round, turn LACT's daemon off first
# (`systemctl disable --now lactd`) and only then set this to
# accept-responsibility. Do not run both.
apply_gpu_optimisations=0

[custom]
