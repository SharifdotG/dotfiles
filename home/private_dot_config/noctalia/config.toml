# Noctalia v5 - the desktop shell (bar, launcher, notifications, lock, OSD).
#
# ── HOW THIS FILE CAN LOSE ─────────────────────────────────────────────────
# Noctalia loads three layers, in order:
#   1. built-in defaults
#   2. THIS file (plus anything it pulls in via [include])
#   3. ~/.local/state/noctalia/settings.toml, written by the Settings GUI
# Layer 3 loads LAST and WINS. So a value you set here can be silently overridden
# by something you clicked once in the GUI months ago.
#
# Do not try to defeat that - chmod'ing settings.toml read-only just turns a
# quiet override into a quiet save failure. Instead, use the fact that Noctalia
# REMOVES a GUI key when its value matches the layer below: settings.toml
# self-prunes down to exactly what diverges, which makes it an accurate drift
# signal rather than noise.
#
# The workflow, when you have tuned something in the GUI and want to keep it:
#   1. noctalia config export > /tmp/merged.toml
#   2. diff /tmp/merged.toml ~/.config/noctalia/config.toml
#   3. copy the keys you want into this file
#   4. chezmoi re-add ~/.config/noctalia/config.toml
#   5. rm ~/.local/state/noctalia/settings.toml     # clears all GUI overrides
#   6. confirm nothing changed visually - if it did, step 3 missed something
#
# scripts/doctor.sh warns whenever settings.toml is non-empty, so this never
# goes unnoticed.

[theme]
mode = "light"
# NB: a custom palette rather than source = "builtin" + builtin = "Catppuccin".
# Both would look right today, but a builtin can be retuned upstream, and every
# other themed file in this repo (starship.toml, the zsh syntax-highlighting
# theme, ghostty, btop, micro) pins exact hexes in git. Consistency wins.
source = "custom"
custom_palette = "CatppuccinLatte"

[theme.templates]
# This is what closes the GTK, Qt, ghostty and btop theming gaps: Noctalia
# renders its active palette into each app's own config format.
# NB: chezmoi ignores the files these produce - see home/.chezmoiignore. The
# split is "Noctalia owns colour, chezmoi owns behaviour"; without the ignore
# rules the two would overwrite each other on every apply.
enable_builtin_templates = true
builtin_ids = ["gtk3", "gtk4", "qt6ct"]
# NB: only the three where chezmoi genuinely cannot own the colour. Noctalia
# also ships templates for ghostty, btop, starship, kitty, foot, helix and more,
# and it is tempting to enable them all - but that puts terminal colour under
# two owners, and the loser is whichever ran last. ghostty has catppuccin-latte
# built in, btop takes a static theme file, and starship's palette is already
# pinned in starship.toml, so all three are chezmoi's with no ambiguity.
# GTK and Qt are different: there is no static file that expresses them well and
# nothing else on the system will write them now that KDE is gone.

[shell]
font_family = "Inter"
corner_radius_scale = 1.0
clipboard_enabled = true

[shell.animation]
enabled = true
speed = 1.0

[bar.default]
position = "top"
thickness = 30
reserve_space = true
start  = ["launcher", "workspaces", "active-window"]
center = ["clock"]
end    = ["tray", "media", "network", "bluetooth", "volume", "brightness", "battery", "control-center"]

# NB: eDP-1 runs at scale 1.25, so a 30px bar eats 30 of only 864 logical rows.
# The external panel has 1080 and can afford the full height.
[bar.default.monitor."eDP-1"]
match = "eDP-1"
thickness = 26

[dock]
# Off deliberately: with a scrollable strip plus the overview, a dock is a
# second window-switching mechanism that costs vertical space on a 864-row panel.
enabled = false

[wallpaper]
directory = "~/Pictures/Wallpapers"
fill_mode = "crop"
