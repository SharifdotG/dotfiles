# GTK settings - NOT colours.
#
# Under Plasma this file was deliberately unmanaged, because kde-gtk-config
# regenerated the whole directory from the active colour scheme and would have
# clobbered anything chezmoi wrote. Under niri nothing regenerates it, so the
# opposite rule applies: unmanaged means GTK apps sit on default Adwaita forever
# while everything else is themed.
#
# The colour half is still not ours: Noctalia's gtk3/gtk4 templates write
# noctalia.css and import it into gtk.css. Those files are in .chezmoiignore.
# This file carries only the things a palette cannot express.
[Settings]
gtk-theme-name=adw-gtk3
gtk-icon-theme-name=Papirus-Light
gtk-font-name=Inter 10
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-application-prefer-dark-theme=0
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
