# MangoHud - the in-game overlay. Desktop machine only (see home/.chezmoiignore).
#
# NB: the reason this file exists is not decoration. On an RX 570 the single
# most valuable thing the overlay tells you is WHICH RENDERER you got. A
# missing 32-bit Vulkan driver does not error - the loader silently falls back
# to llvmpipe and the game runs on the CPU. `gpu_name` below is how you catch
# that in one glance instead of blaming the hardware. scripts/doctor.sh checks
# the same thing without launching a game.
#
# Toggle with Shift_R+F12. Verify the config is actually being read with:
#   MANGOHUD_CONFIGFILE=~/.config/MangoHud/MangoHud.conf mangohud glxgears
# and check the overlay matches the colours below - MangoHud, like Ghostty,
# ignores keys it does not recognise rather than complaining.

legacy_layout=false

# -- what to show -----------------------------------------------------------
gpu_stats
gpu_temp
gpu_load_change
gpu_name
vram
cpu_stats
cpu_temp
cpu_load_change
ram
fps
frametime
frame_timing=1
vulkan_driver
engine_version
resolution
# NB: gpu_name and vulkan_driver are the two that earn their place. The rest is
# the usual telemetry; these two are the llvmpipe tripwire.

# -- where -------------------------------------------------------------------
position=top-left
font_size=20
table_columns=3
background_alpha=0.55
round_corners=6
toggle_hud=Shift_R+F12
toggle_logging=Shift_L+F2

# -- Catppuccin Latte, to match the rest of this repo ------------------------
# Hex without the leading '#', which is MangoHud's format. Values are the
# published Latte palette, not eyeballed.
text_color=4C4F69
background_color=EFF1F5
gpu_color=40A02B
cpu_color=1E66F5
vram_color=8839EF
ram_color=EA76CB
engine_color=D20F39
io_color=DF8E1D
frametime_color=FE640B
media_player_color=4C4F69
wine_color=7287FD
