# Portal backend arbitration. niri ships a default at
# /usr/share/xdg-desktop-portal/niri-portals.conf; this overrides it so the
# choices are visible and version-controlled rather than inherited.
#
# Three things depend on getting this right, and all three fail quietly:
#
#   Settings=gtk    serves org.freedesktop.appearance, which is what VS Code's
#                   "window.autoDetectColorScheme" reads. Without it VS Code
#                   silently stops following the light/dark theme.
#   ScreenCast=gnome  is what makes screen sharing work at all (Teams/Meet in
#                   Firefox, OBS). With no portals.conf present the backends
#                   race on D-Bus and you get a picker that works in one app and
#                   hangs in another.
#   Secret=gnome-keyring  replaces kwallet, which left with Plasma. gh, VS Code
#                   and anything else using libsecret talk to this.
#
# Verify after login - this must print 2 (light):
#   gdbus call --session -d org.freedesktop.portal.Desktop \
#     -o /org/freedesktop/portal/desktop \
#     -m org.freedesktop.portal.Settings.Read org.freedesktop.appearance color-scheme
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=gnome
org.freedesktop.impl.portal.Screenshot=gnome
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.Settings=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
