# Cap Brave at the cgroup level so it can't crowd out everything else, and put
# it in browser.slice so the cap applies to the whole browser rather than to
# each of its scopes separately.
#
# This is the replacement for the Firefox cap that did NOT survive the browser
# switch. On the outgoing machine the old one is still on disk at
# ~/.config/systemd/user/app-org.mozilla.firefox@.service.d/50-memory.conf - not
# an orphan to delete there, it just stopped covering the browser actually in
# use. It is NOT carried by this repo, so on a rebuilt machine it will not
# exist; do not go looking for it.
#
# WHY NOT A BRAVE SETTING: same reason as Firefox. There is no "use at most N
# GB" pref. Every knob (process count, memory saver, tab discarding) trims the
# baseline and then stops mattering, because the real cost is the pages - a
# dozen permanently-open SPAs that each legitimately want 300-600 MB. You
# cannot pref your way out of that, only put a ceiling on it from outside.
#
# WHY THIS DIRECTORY NAME - the part that is easy to get wrong, and which an
# earlier note in scripts/doctor.sh got wrong:
#
#   Plasma launches the .desktop as a unit of its own,
#   app-brave\x2dorigin@<hex>.service. Chromium ALSO self-registers its own
#   transient scope, app-org.chromium.Chromium-<PID>.scope, and moves some of
#   its processes there. This file covers the scope; the service is covered by
#   app-brave\x2dorigin@.service.d/50-memory.conf next door.
#
#   CORRECTION, 2026-09-04. This block used to say Brave "does not stay in"
#   the service and migrates "the bulk of its processes - 33 of 35" into the
#   scope. That measurement does not reproduce, and the whole design rested on
#   it. Re-measured on a normal session:
#       app-brave\x2dorigin@<hex>.service     35 procs  3.44 GiB  uncapped
#       app-org.chromium.Chromium-<PID>.scope   2 procs  0.80 GiB  6G
#   The split is the other way round: GPU process, all three zygotes, the
#   network and storage utility processes, crashpad and every renderer stay in
#   the SERVICE. So this file alone capped 5% of the processes and 19% of the
#   memory. Always re-measure with
#       for p in $(pgrep -f brave); do cut -d: -f3 /proc/$p/cgroup; done |
#           sort | uniq -c
#   before trusting any number in this comment.
#
#   That PID suffix makes the exact-name drop-in dir useless (new every launch),
#   and the `@.service.d` TEMPLATE trick that worked for Firefox does not apply
#   TO A SCOPE, because a scope is not a template unit. Hence the old conclusion
#   that Chromium could not be targeted. That conclusion was wrong twice over:
#   the scope is reachable by dash-truncation (below), AND the service - which
#   is where Brave actually lives - is a template instance after all, so the
#   Firefox trick applies to it unchanged. See the sibling file.
#
#   systemd's DASH-TRUNCATION drop-in search is a separate feature from
#   templating, and it does reach this. systemd.unit(5), verified against the
#   systemd 259 man page on this machine:
#     "for a unit name foo-bar-baz.service not only the regular drop-in
#      directory foo-bar-baz.service.d/ is searched but also both
#      foo-bar-.service.d/ and foo-.service.d/"
#   So app-org.chromium.Chromium-<any PID>.scope reads THIS directory. The
#   shorter `app-.scope.d/` would match too, but that is every app scope in the
#   session, which is not what we want.
#
# VERIFIED LIVE 2026-09-03, against a running Brave and against synthetic
# scopes made to mimic Chromium's naming and launch properties:
#   MemoryHigh reaches an ALREADY-RUNNING Brave on `systemctl --user
#   daemon-reload`, no restart - both live scopes reported
#   MemoryHigh=6442450944 with this file in DropInPaths, and
#   /sys/fs/cgroup/.../memory.high read back 6442450944.
#
#   Slice= overrides the Slice=app.slice that Chromium passes explicitly in its
#   own StartTransientUnit call - a fresh scope landed in
#   user@1000.service/browser.slice/ despite asking for app.slice.
#
# NB: Slice= only takes effect for scopes created AFTER this file is in place.
# A running scope reports Slice=browser.slice immediately but its ControlGroup=
# stays under app.slice, because a live cgroup cannot be re-parented. So the
# slice's aggregate cap starts working at the next Brave launch, while the
# MemoryHigh below covers the currently-running one in the meantime. That
# overlap is the reason BOTH values are set rather than just the slice's.
#
# MemoryHigh, not MemoryMax:
#   MemoryHigh = throttle + reclaim. Over the line the kernel pushes Brave's
#                coldest pages out until it fits. Nothing dies.
#   MemoryMax  = hard wall. Over the line the cgroup OOM killer shoots Brave -
#                and since Chromium names EVERY process in the tree `brave`,
#                parent included, that can take the whole browser rather than a
#                tab. Same trap as earlyoom's --prefer after the switch; see the
#                NB in system/systemd/system/earlyoom.service.d/99-args.conf.
#
# zram is the swap device here (zstd, 3.6:1 measured 2026-09-03), so "reclaimed"
# means "compressed in RAM at a third of the size", not "read back off the
# NVMe". That is why this is cheap on this machine specifically, and why
# vm.swappiness is already 180 in system/sysctl.d/99-memory-tuning.conf.
#
# 6G of 15.3G total leaves ~9G for Docker, Nx/Angular, .NET and the desktop.
# The number lives in THREE places and they must agree: browser.slice,
# app-brave\x2dorigin@.service.d/50-memory.conf, and the expected value in
# scripts/doctor.sh's browser checks. `systemctl --user daemon-reload` applies
# the unit files without a restart; nothing in this repo runs it for you except
# home/.chezmoiscripts/run_onchange_after_30-user-units.sh.tmpl.
#
# CAVEAT, so this is not mistaken for something it is not: this makes the KERNEL
# reclaim Brave's pages. It does NOT make Brave release anything. Chromium's own
# memory saver watches system-wide pressure and is not cgroup-aware, so it will
# not fire because of this cap.
[Scope]
Slice=browser.slice
MemoryHigh=6G
