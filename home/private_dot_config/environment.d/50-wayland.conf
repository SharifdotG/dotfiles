# Read by the systemd user manager, so this covers everything launched as a unit
# (including anything uwsm starts). niri's own environment{} block in
# config.kdl mirrors these for processes the compositor spawns directly -
# niri children do NOT read environment.d. Keep the two in sync.
QT_QPA_PLATFORMTHEME=qt6ct
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
ELECTRON_OZONE_PLATFORM_HINT=auto
MOZ_ENABLE_WAYLAND=1
# NB: nothing in this repo set this before, even though packages/desktop.tsv has
# carried intel-media-driver "for VA-API on UHD 620" since it was written. The
# driver being installed is not the same as it being selected.
LIBVA_DRIVER_NAME=iHD
XCURSOR_THEME=Adwaita
XCURSOR_SIZE=24
# NB: do NOT set GTK_THEME here. It hard-overrides gtk-3.0/settings.ini and
# breaks libadwaita apps, which is a confusing failure to track down later.
