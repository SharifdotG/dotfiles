# NB: THIS FILE IS NOT APPLIED BY CHEZMOI DIRECTLY, and that is a portability
# fix rather than a preference. Its target path is
#     ~/.config/systemd/user/app-brave\x2dorigin@.service.d/50-memory.conf
# and that literal backslash is not legal in a filename on Windows or macOS,
# so `git clone` of this repo ABORTED there:
#     error: invalid path 'home/private_dot_config/systemd/user/
#            app-brave\x2dorigin@.service.d/50-memory.conf'
#     fatal: unable to checkout working tree
# The clone left a .git directory and no files at all. One Linux-only path made
# the whole repo unclonable everywhere else, including for anyone who just
# wants to read it.
#
# So the file lives in .chezmoitemplates/ under a Windows-safe name, and
# home/.chezmoiscripts/run_onchange_after_30-user-units.sh.tmpl inlines this
# content and writes it to the escaped path at apply time. The escaping problem
# moves from a FILENAME (which git must checkout) into a STRING inside a shell
# script (which git does not care about).
#
# Consequences worth knowing:
#   - `chezmoi diff` / `chezmoi status` do NOT show drift in the target file.
#     The script owns it, and run_onchange_ re-runs whenever this content
#     changes because the rendered script embeds it.
#   - Removing this file does NOT remove the target. Delete it by hand.
#   - Editing it here is still the right place to edit it.
#
# The cap that actually reaches Brave. Read this together with
# app-org.chromium.Chromium-.scope.d/50-memory.conf next door - they cover two
# different cgroups and BOTH are needed.
#
# WHY THIS FILE EXISTS - a correction, measured 2026-09-04.
#
# The scope drop-in next door was written on a 2026-09-03 measurement that said
# Chromium migrates "33 of 35" of its processes into its own transient scope,
# app-org.chromium.Chromium-<PID>.scope. That measurement does not reproduce.
# Re-measured on a normal session:
#
#   app-brave\x2dorigin@<hex>.service   35 procs   3.44 GiB   MemoryHigh=max
#   app-org.chromium.Chromium-<PID>.scope 2 procs  0.80 GiB   MemoryHigh=6G
#
# The GPU process, all three zygotes, the network and storage utility processes,
# crashpad and EVERY renderer stay in the .service cgroup that Plasma created.
# Two processes move to the scope. So the scope drop-in was capping 5% of the
# processes and 19% of the memory, and browser.slice - "the aggregate ceiling
# that means what it says" - was a 6G ceiling over 0.8 GiB of Brave with 3.4 GiB
# sitting outside it.
#
# WHY THE TEMPLATE FORM WORKS HERE. The scope file argues that the `@.service.d`
# template trick "does not apply either, because a scope is not a template
# unit". That is true OF THE SCOPE and false of the service. Plasma launches
# brave-origin.desktop as app-brave\x2dorigin@<hex>.service - `systemctl --user
# show` reports Id=app-brave\x2dorigin@031aa5f0...service - which IS a template
# instance, so this directory reaches it whatever the hex instance is. It is the
# same mechanism as the Firefox drop-in that used to live at
# ~/.config/systemd/user/app-org.mozilla.firefox@.service.d/.
#
# NB: the `\x2d` in the directory name is not decoration and must not be
# "cleaned up" to a plain dash. systemd escapes the `-` in the instance name
# `brave-origin`, so the unit is literally app-brave\x2dorigin@.service. A
# directory named app-brave-origin@.service.d matches nothing.
#
# NB: dash-truncation is not an option here the way it is for the scope. The
# only literal `-` in this unit name is the one in `app-`, so the truncated
# search lands on app-.service.d/ - every app service in the session.
#
# Slice= and MemoryHigh= for the same reasons argued at length next door:
# MemoryHigh throttles and reclaims (into zram, at ~3.6:1) rather than shooting
# the process tree the way MemoryMax would - and Chromium names every process in
# the tree `brave`, parent included, so a hard wall can take the whole browser.
# Slice= binds only for cgroups created AFTER this file lands, so a Brave that
# was already running keeps its old parent until it restarts; MemoryHigh covers
# it in the meantime.
#
# 6G here and 6G in browser.slice is deliberate belt-and-braces, not a 12G
# ceiling: both cgroups are children of browser.slice, so the SLICE caps the sum
# no matter how many scopes or services Chromium ends up with.
#
# Changing the number means changing it in THREE places - browser.slice,
# app-org.chromium.Chromium-.scope.d/50-memory.conf, and the expected value in
# scripts/doctor.sh - or doctor starts failing.
[Service]
Slice=browser.slice
MemoryHigh=6G
