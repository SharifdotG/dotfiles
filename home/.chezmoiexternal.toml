# Upstreams fetched at `chezmoi apply` time rather than committed into this repo.
#
# type = "git-repo", NOT "archive" with exact = true.
# oh-my-zsh and its plugins are installed as git checkouts. An "archive" external
# with `exact = true` means "delete anything not in the tarball", which would remove
# ~/.oh-my-zsh/.git and each plugin's .git directory -- destroying the checkouts and
# omz's own update mechanism. `git-repo` matches how they are actually installed and
# updates them with a fast-forward pull.

[".oh-my-zsh"]
    type = "git-repo"
    url = "https://github.com/ohmyzsh/ohmyzsh.git"
    refreshPeriod = "168h"
[".oh-my-zsh".clone]
    args = ["--depth=1"]
[".oh-my-zsh".pull]
    args = ["--ff-only"]

[".oh-my-zsh/custom/plugins/zsh-autosuggestions"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-autosuggestions.git"
    refreshPeriod = "168h"
[".oh-my-zsh/custom/plugins/zsh-autosuggestions".clone]
    args = ["--depth=1"]
[".oh-my-zsh/custom/plugins/zsh-autosuggestions".pull]
    args = ["--ff-only"]

[".oh-my-zsh/custom/plugins/zsh-completions"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-completions.git"
    refreshPeriod = "168h"
[".oh-my-zsh/custom/plugins/zsh-completions".clone]
    args = ["--depth=1"]
[".oh-my-zsh/custom/plugins/zsh-completions".pull]
    args = ["--ff-only"]

[".oh-my-zsh/custom/plugins/zsh-syntax-highlighting"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-syntax-highlighting.git"
    refreshPeriod = "168h"
[".oh-my-zsh/custom/plugins/zsh-syntax-highlighting".clone]
    args = ["--depth=1"]
[".oh-my-zsh/custom/plugins/zsh-syntax-highlighting".pull]
    args = ["--ff-only"]

# ── Desktop theming ──────────────────────────────────────────────────────────
# Both of these are UPSTREAM ARTEFACTS, not configuration, which is why they are
# fetched rather than vendored: they are large-ish, they are not ours to edit,
# and committing them would mean hand-merging on every upstream bump.

# Catppuccin Latte Blue colour scheme. ONE file, not the whole catppuccin/kde
# installer.
#
# The installer also ships an Aurorae window decoration, a Plasma style, a
# look-and-feel package, a splash and its own cursors, and it drives them with
# kwriteconfig6 + plasma-apply-lookandfeel + an interactive prompt. We want none
# of that: the decoration stays KDE's own Breeze, and the cursor is WhiteSur
# below. A .colors file is all that is needed to recolour Plasma, because the
# scheme's [WM] section is exactly what Breeze reads for the titlebar - so
# Breeze ends up Catppuccin-coloured while remaining Breeze.
#
# Pinned to a tag, not main: this is the file that decides what every window on
# the machine looks like, and a silent upstream restyle mid-week is not wanted.
# Bump the tag deliberately.
[".local/share/color-schemes/CatppuccinLatteBlue.colors"]
    type = "file"
    url = "https://github.com/catppuccin/kde/raw/v0.4.0/generated/color-schemes/CatppuccinLatteBlue.colors"
    refreshPeriod = "168h"

# WhiteSur cursors. Upstream's install.sh is literally `cp -pr dist <dir>`, so
# an archive external IS the official install - there is nothing to build and no
# AUR wrapper worth carrying.
#
# NB: stripComponents=2 drops "WhiteSur-cursors-master/dist/", landing
# index.theme + cursors/ + cursors_scalable/ at the top of the target dir. That
# layout is load-bearing: KDE keys the cursor theme off the DIRECTORY name, not
# index.theme's Name=, so the theme is "WhiteSur-cursors" (what
# run_onchange_after_20-kde-theme.sh writes) and not "WhiteSur Cursors".
#
# exact=true is safe here (unlike the git-repo externals above, where it would
# delete .git): nothing but the theme lives in this directory.
#
# No tag to pin to - upstream has never cut one - so this tracks master.
[".local/share/icons/WhiteSur-cursors"]
    type = "archive"
    url = "https://github.com/vinceliuice/WhiteSur-cursors/archive/refs/heads/master.tar.gz"
    exact = true
    stripComponents = 2
    include = ["*/dist/**"]
    refreshPeriod = "168h"

# ── Catppuccin Global Theme + splash ─────────────────────────────────────────
#
# CORRECTION, 2026-09-05. The colour-scheme note above says the rest of the
# catppuccin/kde installer is unwanted, and that was half right. What it got
# wrong: those look-and-feel packages ARE selectable Global Themes
# (KPackageStructure: Plasma/LookAndFeel), so without them System Settings ->
# Appearance -> Global Theme has no Catppuccin entry at all - which is exactly
# what "the Catppuccin theme was not added" meant.
#
# Verified contents of the package's contents/defaults, which is all it
# contains:
#     [kdeglobals][General] ColorScheme=CatppuccinLatteBlue     <- want
#     [kcminputrc][Mouse]   cursorTheme=catppuccin-latte-blue-cursors
#     [kwinrc][org.kde.kdecoration2] library=org.kde.kwin.aurorae
#                           theme=__aurorae__svg__CatppuccinLatte-Modern
#                           BorderSize=None, BorderSizeAuto=false
#     [plasmarc][Theme]     name=default   (it ships no Plasma style)
#     [KSplash]             Theme=Catppuccin-Latte-Blue-splash  <- want
# It sets NO icon theme, so WhiteSur icons are untouched by it. The cursor and
# decoration lines are the two we do not want, and the theme script re-asserts
# both AFTER applying the package - user config outranks ~/.config/kdedefaults/,
# which is where a look-and-feel writes its defaults.
#
# "Modern" vs "Classic" is only which Aurorae decoration the defaults name, and
# we override that either way.
[".local/share/plasma/look-and-feel/Catppuccin-Latte-Blue"]
    type = "archive"
    url = "https://github.com/catppuccin/kde/archive/refs/tags/v0.4.0.tar.gz"
    exact = true
    stripComponents = 5
    include = ["*/generated/look-and-feel/Modern/Catppuccin-Latte-Blue/**"]
    refreshPeriod = "168h"

# The splash has to be ASSEMBLED from three places, and this is the trap.
#
# generated/splash/Catppuccin-Latte-Blue-splash/contents/splash/ contains ONLY
# images/. There is no Splash.qml in it. Upstream's install.sh copies the QML in
# from generated/splash-qml/ and the logo from Resources/, and a package without
# Splash.qml installs cleanly, appears in the theme list, and renders nothing at
# all - a silent failure of exactly the kind this repo exists to catch.
#
# NB: no exact=true on this one, unlike the theme above. The two file externals
# below write INTO this directory, and exact would delete them on every apply.
[".local/share/plasma/look-and-feel/Catppuccin-Latte-Blue-splash"]
    type = "archive"
    url = "https://github.com/catppuccin/kde/archive/refs/tags/v0.4.0.tar.gz"
    # NB: 4, not 5 like the theme above. The splash package sits one directory
    # shallower in the tarball - generated/splash/<pkg>/ against
    # generated/look-and-feel/Modern/<pkg>/ - and copying the 5 across is how
    # you get an empty target directory with no error. Counted from `tar tzf`.
    stripComponents = 4
    include = ["*/generated/splash/Catppuccin-Latte-Blue-splash/**"]
    refreshPeriod = "168h"

[".local/share/plasma/look-and-feel/Catppuccin-Latte-Blue-splash/contents/splash/Splash.qml"]
    type = "file"
    url = "https://github.com/catppuccin/kde/raw/v0.4.0/generated/splash-qml/CatppuccinLatte-Splash.qml"
    refreshPeriod = "168h"

# Latte_Logo.png, not Logo.png: upstream picks the Latte-specific asset for the
# light flavour and installs it UNDER THE NAME Logo.png, which Splash.qml then
# references. Fetching Logo.png here would give the dark-flavour logo.
[".local/share/plasma/look-and-feel/Catppuccin-Latte-Blue-splash/contents/splash/images/Logo.png"]
    type = "file"
    url = "https://github.com/catppuccin/kde/raw/v0.4.0/Resources/splash-screen/contents/splash/images/Latte_Logo.png"
    refreshPeriod = "168h"
